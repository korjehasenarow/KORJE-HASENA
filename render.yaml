databases:
  - name: korje-hasena-db
    databaseName: korje_hasena
    plan: free

services:
  - type: web
    name: korje-hasena
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: korje-hasena-db
          property: connectionString
